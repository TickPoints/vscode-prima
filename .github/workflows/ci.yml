# CI pipeline: compile, test, and package the extension on every push/PR.
#
# - compile: `tsc` must pass (strict mode, no unused locals).
# - test:    @vscode/test-electron integration suite under xvfb (headless Linux).
# - package: `vsce package` produces a `.vsix` uploaded as a build artifact.

name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: compile, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test (headless)
        run: xvfb-run -a npm test

      - name: Package .vsix
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: prima-lang-vsix
          path: '*.vsix'
          if-no-files-found: error
