# CI pipeline: compile, test, and package the extension on every push/PR.
#
# - compile: `tsc` must pass (strict mode, no unused locals).
# - test:    @vscode/test-electron integration suite under xvfb (headless Linux).
# - package: `vsce package` produces a `.vsix` uploaded as a build artifact.
#
# The JavaScript toolchain is Bun (see `packageManager` in package.json).

name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: compile, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: bun run compile

      - name: Test (headless)
        run: xvfb-run -a bun run test

      - name: Package .vsix
        run: bun run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: prima-lang-vsix
          path: '*.vsix'
          if-no-files-found: error
